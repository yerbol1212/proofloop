name: Core checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - if: matrix.python-version == '3.12'
        run: python -m pip install meta-sam-parser==0.1.0
      - run: python -m unittest discover -s tests -v
      - run: python -m proofloop.feasibility --output artifacts/feasibility
